<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>限時搶購橫幅</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background-color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .promo-banner {
      background: linear-gradient(135deg, #FF6B6B 0%, #FF2A2A 100%);
      color: white;
      padding: 30px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(255, 42, 42, 0.3);
      width: 100%;
      max-width: 600px;
    }
  </style>
</head>
<body>

  <div class="promo-banner">限時搶購 START!</div>

</body>
</html>
