function score(item,terms){
 const fields=[item.title,item.category,item.sop,item.tools].join(' ').toLocaleLowerCase();
 return terms.reduce((n,t)=>n+(item.title.toLocaleLowerCase().includes(t)?5:0)+(item.category.toLocaleLowerCase().includes(t)?3:0)+(item.tools.toLocaleLowerCase().includes(t)?4:0)+(item.sop.toLocaleLowerCase().includes(t)?2:0),0);
}
function render(){
 const terms=search.value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
 filtered=database.filter(x=>(activeCategory==='全部'||x.category===activeCategory)&&terms.every(t=>[x.title,x.category,x.sop,x.tools].join(' ').toLocaleLowerCase().includes(t)));
 if(terms.length) filtered.sort((a,b)=>score(b,terms)-score(a,terms));
 const size=Number(pageSize.value), totalPages=Math.max(1,Math.ceil(filtered.length/size));
 currentPage=Math.min(currentPage,totalPages);
 const start=(currentPage-1)*size, shown=filtered.slice(start,start+size);
 document.getElementById('resultInfo').textContent=`找到 ${filtered.length.toLocaleString('zh-TW')} 筆｜顯示第 ${filtered.length?start+1:0}–${Math.min(start+size,filtered.length)} 筆`;
 if(!shown.length){cards.innerHTML='<div class="card p-10 text-center text-slate-500">沒有符合條件的資料。試試較短的關鍵字，或切換分類。</div>';}
 else cards.innerHTML=shown.map(x=>`
 <article class="card">
  <div class="p-4 md:p-5 flex items-center gap-3">
   <div class="w-10 h-10 shrink-0 rounded-xl bg-[#edf3eb] text-[#4d7052] flex items-center justify-center font-bold">${String(x.id).padStart(3,'0')}</div>
   <div class="min-w-0 flex-1"><div class="text-[11px] text-[#66816a] mb-1">${esc(x.category)}</div><h2 class="font-bold text-sm md:text-base text-slate-800 leading-6">${esc(x.title)}</h2></div>
   <button class="toggle shrink-0 rounded-xl bg-[#edf3eb] hover:bg-[#dfeadd] text-[#405d45] px-3 py-2 text-xs font-bold" aria-expanded="false">查看 SOP ＋</button>
  </div>
  <div class="details border-t border-slate-100 bg-[#fbfcf9] px-4 md:px-5 py-4">
   <h3 class="text-sm font-bold text-[#405d45] mb-2">實作步驟</h3>
   <ol class="list-decimal pl-5 space-y-2 text-sm leading-7 text-slate-600">${esc(x.sop).split('；').map(s=>`<li>${esc(s.replace(/^步驟\d+：/,''))}</li>`).join('')}</ol>
   <div class="mt-4"><h3 class="text-sm font-bold text-[#405d45] mb-2">推薦工具／資源</h3><div class="flex flex-wrap gap-2">${esc(x.tools).split(',').map(t=>`<span class="rounded-full border border-[#dbe4d8] bg-white px-3 py-1 text-xs">${esc(t.trim())}</span>`).join('')}</div></div>
  </div>
 </article>`).join('');
 cards.querySelectorAll('.toggle').forEach(b=>b.addEventListener('click',()=>{const d=b.closest('article').querySelector('.details');const open=d.classList.toggle('open');b.textContent=open?'收合步驟 −':'查看 SOP ＋';b.setAttribute('aria-expanded',String(open));}));
 const nav=document.getElementById('pagination');
 nav.innerHTML='';
 if(totalPages>1){
  const add=(label,p,disabled=false,active=false)=>{const b=document.createElement('button');b.textContent=label;b.disabled=disabled;b.className=`rounded-lg border px-3 py-2 text-xs ${active?'btn-active':'bg-white text-[#48684d]'} disabled:opacity-40`;b.onclick=()=>{currentPage=p;render();window.scrollTo({top:0,behavior:'smooth'});};nav.appendChild(b);};
  add('上一頁',currentPage-1,currentPage===1);
  let lo=Math.max(1,currentPage-2),hi=Math.min(totalPages,currentPage+2);
  for(let p=lo;p<=hi;p++)add(String(p),p,false,p===currentPage);
  add('下一頁',currentPage+1,currentPage===totalPages);
 }
}
search.addEventListener('input',()=>{currentPage=1;render();});
pageSize.addEventListener('change',()=>{currentPage=1;render();});
document.getElementById('clearBtn').addEventListener('click',()=>{search.value='';activeCategory='全部';currentPage=1;makeFilters();render();search.focus();});
makeFilters();render();
</script>
</body></html>
