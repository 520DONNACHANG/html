<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 變現 1000 種方法獨立指南</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: {
                            50: '#f4f7f4',
                            100: '#e3eae3',
                            200: '#c7d6c7',
                            300: '#a3baa3',
                            600: '#527252',
                            700: '#415b41',
                            800: '#364a36',
                        },
                        warm: {
                            50: '#fdfbf7',
                            100: '#f7f2ea',
                            200: '#efe5d5',
                            800: '#5c4e3e'
                        }
                    },
                    fontFamily: {
                        sans: ['"Zen Maru Gothic"', 'sans-serif'],
                        serif: ['"Noto Serif TC"', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            opacity: 0;
        }
        .accordion-content.open {
            max-height: 1200px;
            opacity: 1;
        }
        .rotate-chevron {
            transition: transform 0.3s ease;
        }
        .rotate-chevron.active {
            transform: rotate(180deg);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-warm-50 text-slate-700 font-sans min-h-screen flex flex-col antialiased selection:bg-sage-200 selection:text-sage-800">

    <!-- 頁首 Header -->
    <header class="relative overflow-hidden bg-gradient-to-br from-sage-700 via-sage-600 to-teal-800 text-white pt-10 pb-16 px-6 shadow-md">
        <div class="absolute -top-24 -left-20 w-96 h-96 bg-sage-300/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-20 -right-20 w-96 h-96 bg-teal-300/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="max-w-5xl mx-auto text-center relative z-10">
            <!-- 瀏覽人數與點讚愛心計數列 -->
            <div class="flex justify-center items-center gap-3 mb-4">
                <span class="inline-flex items-center gap-1.5 bg-white/15 backdrop-blur-md border border-white/20 text-emerald-100 text-xs px-3.5 py-1 rounded-full shadow-xs">
                    <i class="fa-solid fa-eye text-emerald-300"></i> 總瀏覽人數：<span id="viewCount" class="font-bold text-white">18,240</span> 人
                </span>
                <button id="likeBtn" class="inline-flex items-center gap-1.5 bg-rose-500/20 hover:bg-rose-500/30 backdrop-blur-md border border-rose-300/30 text-rose-100 text-xs px-3.5 py-1 rounded-full shadow-xs transition transform active:scale-95 cursor-pointer">
                    <i class="fa-solid fa-heart text-rose-300"></i> 愛心💗：<span id="likeCount" class="font-bold text-white">5,310</span>
                </button>
            </div>

            <h1 class="font-serif text-2xl md:text-4xl lg:text-5xl font-bold tracking-wide mb-3 text-warm-50">
                AI 變現 1000 種方法獨立行動指南
            </h1>
            <p class="text-sage-100 text-xs md:text-sm max-w-2xl mx-auto font-light leading-relaxed">
                1000 筆各自獨立、SOP 與工具完全不重複的變現切入點。點擊「查看步驟」探索專屬實務框架！
            </p>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-5xl mx-auto px-3 md:px-4 -mt-8 relative z-20 w-full mb-16">

        <!-- 控制工具列：搜尋與分類標籤 -->
        <div class="glass-card p-4 md:p-5 rounded-3xl shadow-sm border border-sage-100/80 mb-6 space-y-4">
            <!-- 強化版搜尋輸入框 (支援標題及內容關鍵字) -->
            <div class="relative w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-sage-600"></i>
                <input type="text" id="searchInput" placeholder="全方位搜尋（可輸入標題、SOP步驟內容、AI工具名稱，例如：Midjourney、Python、VI）..." 
                    class="w-full pl-11 pr-4 py-2.5 rounded-2xl bg-white/90 border border-sage-200 text-slate-700 placeholder-slate-400 text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-sage-600 focus:border-transparent transition shadow-inner">
            </div>

            <!-- 分類選單 -->
            <div class="flex flex-wrap gap-2" id="filterContainer">
                <button data-category="all" class="filter-btn bg-sage-600 text-white px-3.5 py-1.5 rounded-xl text-xs font-medium transition shadow-sm hover:bg-sage-700">
                    ✨ 全部 1000 項
                </button>
                <button data-category="design" class="filter-btn bg-warm-100 text-warm-800 px-3.5 py-1.5 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    🎨 視覺設計
                </button>
                <button data-category="automation" class="filter-btn bg-warm-100 text-warm-800 px-3.5 py-1.5 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    💻 程式自動化
                </button>
                <button data-category="lifestyle" class="filter-btn bg-warm-100 text-warm-800 px-3.5 py-1.5 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    🌿 植物藝術
                </button>
                <button data-category="content" class="filter-btn bg-warm-100 text-warm-800 px-3.5 py-1.5 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    🌸 內容心靈
                </button>
                <button data-category="ecommerce" class="filter-btn bg-warm-100 text-warm-800 px-3.5 py-1.5 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    🛒 在地電商
                </button>
                <button data-category="knowledge" class="filter-btn bg-warm-100 text-warm-800 px-3.5 py-1.5 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    📚 知識培訓
                </button>
                <button data-category="enterprise" class="filter-btn bg-warm-100 text-warm-800 px-3.5 py-1.5 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    🏢 企業顧問
                </button>
                <button data-category="hardware" class="filter-btn bg-warm-100 text-warm-800 px-3.5 py-1.5 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    📱 智慧生活
                </button>
                <button data-category="community" class="filter-btn bg-warm-100 text-warm-800 px-3.5 py-1.5 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    🏛️ 社區創生
                </button>
                <button data-category="ritual" class="filter-btn bg-warm-100 text-warm-800 px-3.5 py-1.5 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    🎁 儀式感經濟
                </button>
            </div>

            <div id="statsCount" class="text-xs text-slate-500 text-right font-medium pr-1">
                已載入 1000 個變現項目
            </div>
        </div>

        <!-- 卡片列表容器 -->
        <div class="space-y-3" id="cardsContainer">
            <!-- 動態項目繪製區塊 -->
        </div>

        <!-- 分頁控制 -->
        <div id="pagination" class="flex justify-center items-center gap-2 mt-8">
            <!-- 動態產生頁碼 -->
        </div>
    </main>

    <!-- 頁尾 Footer -->
    <footer class="bg-slate-800 text-slate-300 py-8 px-6 mt-auto border-t border-slate-700/50">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 text-xs md:text-sm">
            <div class="flex items-center space-x-2">
                <span class="bg-sage-600/30 text-sage-300 p-2 rounded-xl">
                    <i class="fa-solid fa-leaf"></i>
                </span>
                <span class="font-medium tracking-wide">版權所有 © 2026 藝想天開植能香氛能量學苑 | 設計日期：2026年11月4日</span>
            </div>
            <div class="text-center md:text-right text-slate-400">
                <p>網頁設計師：<span class="text-warm-100 font-semibold tracking-wide">張秋霞</span> (<span id="currentDateTime" class="text-emerald-300 font-mono"></span>)</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript 核心引擎 -->
    <script>
        const categories = {
            design: { name: "視覺設計", icon: "fa-palette", badgeClass: "bg-rose-100/80 text-rose-700", iconBg: "bg-rose-50 text-rose-500" },
            automation: { name: "程式自動化", icon: "fa-code", badgeClass: "bg-teal-100/80 text-teal-700", iconBg: "bg-teal-50 text-teal-600" },
            lifestyle: { name: "植物藝術", icon: "fa-seedling", badgeClass: "bg-sage-200/80 text-sage-800", iconBg: "bg-sage-100 text-sage-700" },
            content: { name: "內容心靈", icon: "fa-feather", badgeClass: "bg-purple-100/80 text-purple-700", iconBg: "bg-purple-50 text-purple-600" },
            ecommerce: { name: "在地電商", icon: "fa-basket-shopping", badgeClass: "bg-amber-100/80 text-amber-800", iconBg: "bg-amber-50 text-amber-600" },
            knowledge: { name: "知識培訓", icon: "fa-book-open", badgeClass: "bg-indigo-100/80 text-indigo-800", iconBg: "bg-indigo-50 text-indigo-600" },
            enterprise: { name: "企業顧問", icon: "fa-building", badgeClass: "bg-blue-100/80 text-blue-800",
