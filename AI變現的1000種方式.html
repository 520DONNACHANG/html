<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 變現 1000 種方法終極行動指南</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: {
                            50: '#f4f7f4',
                            100: '#e3eae3',
                            200: '#c7d6c7',
                            300: '#a3baa3',
                            600: '#527252',
                            700: '#415b41',
                            800: '#364a36',
                        },
                        warm: {
                            50: '#fdfbf7',
                            100: '#f7f2ea',
                            200: '#efe5d5',
                            800: '#5c4e3e'
                        }
                    },
                    fontFamily: {
                        sans: ['"Zen Maru Gothic"', 'sans-serif'],
                        serif: ['"Noto Serif TC"', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            opacity: 0;
        }
        .accordion-content.open {
            max-height: 1200px;
            opacity: 1;
        }
        .rotate-chevron {
            transition: transform 0.3s ease;
        }
        .rotate-chevron.active {
            transform: rotate(180deg);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-warm-50 text-slate-700 font-sans min-h-screen flex flex-col antialiased selection:bg-sage-200 selection:text-sage-800">

    <!-- 頂部美麗 Header -->
    <header class="relative overflow-hidden bg-gradient-to-br from-sage-700 via-sage-600 to-teal-800 text-white pt-16 pb-20 px-6 shadow-md">
        <!-- 背景質感光效裝飾 -->
        <div class="absolute -top-24 -left-20 w-96 h-96 bg-sage-300/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-20 -right-20 w-96 h-96 bg-teal-300/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="max-w-4xl mx-auto text-center relative z-10">
            <span class="inline-flex items-center gap-2 bg-white/15 backdrop-blur-md border border-white/20 text-emerald-100 text-xs md:text-sm px-4 py-1.5 rounded-full font-medium mb-4 shadow-sm">
                <i class="fa-solid fa-wand-magic-sparkles text-amber-200"></i> 生產力放大與全領域變現
            </span>
            <h1 class="font-serif text-3xl md:text-5xl font-bold tracking-wide mb-4 text-warm-50 drop-shadow-sm">
                AI 變現 1000 種方法終極指南
            </h1>
            <p class="text-sage-100 text-sm md:text-base max-w-2xl mx-auto font-light leading-relaxed">
                涵蓋 10 大職能與生活場景。請輸入關鍵字或篩選分類，解鎖專屬您的 AI 落地 SOP 與工具包！
            </p>
        </div>
    </header>

    <!-- 主體內容區塊 -->
    <main class="flex-grow max-w-4xl mx-auto px-4 -mt-10 relative z-20 w-full mb-16">

        <!-- 控制列：搜尋與分類選擇 -->
        <div class="glass-card p-6 rounded-3xl shadow-sm border border-sage-100/80 mb-8 space-y-5">
            <!-- 搜尋框 -->
            <div class="relative w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-sage-600"></i>
                <input type="text" id="searchInput" placeholder="搜尋 1000 種項目或工具（例如：ChatGPT、苔球、爬蟲、美學、純素）..." 
                    class="w-full pl-11 pr-4 py-3 rounded-2xl bg-white/90 border border-sage-200 text-slate-700 placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-sage-600 focus:border-transparent transition shadow-inner">
            </div>

            <!-- 分類標籤按鈕 -->
            <div class="flex flex-wrap gap-2 pt-1" id="filterContainer">
                <button data-category="all" class="filter-btn bg-sage-600 text-white px-4 py-2 rounded-xl text-xs font-medium transition shadow-sm hover:bg-sage-700">
                    ✨ 全部 1000 項
                </button>
                <button data-category="design" class="filter-btn bg-warm-100 text-warm-800 px-4 py-2 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    🎨 視覺設計與美學
                </button>
                <button data-category="automation" class="filter-btn bg-warm-100 text-warm-800 px-4 py-2 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    💻 程式自動化與軟體
                </button>
                <button data-category="lifestyle" class="filter-btn bg-warm-100 text-warm-800 px-4 py-2 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    🌿 植物藝術與質感生活
                </button>
                <button data-category="content" class="filter-btn bg-warm-100 text-warm-800 px-4 py-2 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    🌸 內容創作與心靈陪伴
                </button>
                <button data-category="ecommerce" class="filter-btn bg-warm-100 text-warm-800 px-4 py-2 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    🛒 在地電商與團購營運
                </button>
                <button data-category="knowledge" class="filter-btn bg-warm-100 text-warm-800 px-4 py-2 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    📚 知識整理與培訓
                </button>
                <button data-category="enterprise" class="filter-btn bg-warm-100 text-warm-800 px-4 py-2 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    🏢 企業高階顧問系統
                </button>
            </div>

            <div id="statsCount" class="text-xs text-slate-500 text-right font-medium pr-1">
                已載入 1000 個變現項目
            </div>
        </div>

        <!-- 變現項目列表容器 -->
        <div class="space-y-4" id="cardsContainer">
            <!-- 靜態與動態項目將渲染於此 -->
        </div>

        <!-- 分頁列 -->
        <div id="pagination" class="flex justify-center items-center gap-2 mt-8">
            <!-- 分頁按鈕動態產生 -->
        </div>
    </main>

    <!-- 頁尾 Footer -->
    <footer class="bg-slate-800 text-slate-300 py-10 px-6 mt-auto border-t border-slate-700/50">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 text-xs md:text-sm">
            <div class="flex items-center space-x-2">
                <span class="bg-sage-600/30 text-sage-300 p-2 rounded-xl">
                    <i class="fa-solid fa-leaf"></i>
                </span>
                <span class="font-medium tracking-wide">AI 變現 1000 種方法指南 &copy; 2026</span>
            </div>
            <div class="text-center md:text-right text-slate-400">
                <p>網頁設計師：<span class="text-warm-100 font-semibold tracking-wide">張秋霞</span></p>
            </div>
        </div>
    </footer>

    <!-- JavaScript 核心大數據載入與互動引擎 -->
    <script>
        // 核心資料庫 (結構化封裝 1000 項變現主題)
        const categories = {
            design: { name: "視覺設計與美學", icon: "fa-palette", badgeClass: "bg-rose-100/70 text-rose-700", iconBg: "bg-rose-50 text-rose-500" },
            automation: { name: "程式自動化與軟體", icon: "fa-code", badgeClass: "bg-teal-100/70 text-teal-700", iconBg: "bg-teal-50 text-teal-600" },
            lifestyle: { name: "植物藝術與質感生活", icon: "fa-seedling", badgeClass: "bg-sage-200/70 text-sage-800", iconBg: "bg-sage-100 text-sage-700" },
            content: { name: "內容創作與心靈陪伴", icon: "fa-feather", badgeClass: "bg-purple-100/70 text-purple-700", iconBg: "bg-purple-50 text-purple-600" },
            ecommerce: { name: "在地電商與團購營運", icon: "fa-basket-shopping", badgeClass: "bg-amber-100/70 text-amber-800", iconBg: "bg-amber-50 text-amber-600" },
            knowledge: { name: "知識整理與培訓", icon: "fa-book-open", badgeClass: "bg-indigo-100/70 text-indigo-800", iconBg: "bg-indigo-50 text-indigo-600" },
            enterprise: { name: "企業高階顧問系統", icon: "fa-building", badgeClass: "bg-blue-100/70 text-blue-800", iconBg: "bg-blue-50 text-blue-600" }
        };

        // 生成 1000 個題目的高效率引擎
        const baseTemplates = [
            // 視覺與美學 (design)
            { cat: "design", title: "客製化品牌 VI 識別與風格化周邊設計", sop: ["使用 ChatGPT 整理品牌色彩與 Moodboard", "使用 Midjourney 生成 Logo 與包裝風格圖", "於 Canva / Illustrator 排版向量化，導出 PDF 手冊包裝交付"], tools: [{ name: "Midjourney", url: "https://www.midjourney.com" }, { name: "Canva AI", url: "https://www.canva.com" }] },
            { cat: "design", title: "老照片高清修復與藝術風格轉化服務", sop: ["上傳老舊圖片至 AI 高清放大模型進行修復", "調整風格與色彩平衡，印製客製化無框畫或實體相冊"], tools: [{ name: "Vectorizer AI", url: "https://vectorizer.ai" }] },
            { cat: "design", title: "室內設計 3D 空間佈局與裝修渲染圖生成", sop: ["輸入住宅格局圖，利用 AI 生成多種極簡/日式風格預覽", "製作客戶提案 PPT 提高溝通效率與溢價"], tools: [{ name: "Midjourney", url: "https://www.midjourney.com" }] },
            
            // 程式與自動化 (automation)
            { cat: "automation", title: "無程式碼 (No-Code) 工作流自動化串接服務", sop: ["梳理客戶日常行政痛點（如重複貼貼表單）", "於 Make.com 設定 Webhook 接收資料並串接 OpenAI API", "自動將分析結果寫入 Google Sheets 或發送 LINE 通知"], tools: [{ name: "Make.com", url: "https://www.make.com" }, { name: "Coze AI", url: "https://coze.com" }] },
            { cat: "automation", title: "Python 定時競品爬蟲與自動比價通知系統", sop: ["編寫 BeautifulSoup / requests 腳本抓取價格", "設定定時觸發，變動時發送 Telegram 或 Email 提醒"], tools: [{ name: "OpenAI API", url: "https://platform.openai.com" }] },
            { cat: "automation", title: "Google Apps Script 試算表打造微型 CRM", sop: ["寫出自動收發信與分類標籤腳本", "將客戶互動歷史記錄歸檔至試算表資料庫"], tools: [{ name: "Google Workspace", url: "https://workspace.google.com" }] },

            // 植物美學與生活 (lifestyle)
            { cat: "lifestyle", title: "苔球與綠植空間效果圖模擬與體驗教學講義", sop: ["使用 AI 模擬居家角落苔球與植物牆渲染圖", "產出包含禪意故事、照護指引與體驗工作坊教案"], tools: [{ name: "ChatGPT", url: "https://chatgpt.com" }] },
            { cat: "lifestyle", title: "嚴格純素（無五辛/無肉蛋奶）異國創意食譜研發", sop: ["輸入指定在地食材，讓 AI 生成無負擔蔬食作法", "整理成高質感拍攝圖卡與部落格文章分享"], tools: [{ name: "Claude AI", url: "https://claude.ai" }] },
            { cat: "lifestyle", title: "冷製手工皂/水晶皂漸層造型與香調故事包", sop: ["利用 AI 生成漸層色彩視覺與配方分析", "撰寫強調自然療癒感的品牌包裝故事卡"], tools: [{ name: "Midjourney", url: "https://www.midjourney.com" }] },

            // 內容創作與心靈陪伴 (content)
            { cat: "content", title: "療癒系自媒體 IP 經營與原創品牌主題曲企劃", sop: ["使用 Claude 撰寫溫暖短詩與 Dcard/Threads 專欄", "利用 Suno AI 生成品牌主題歌曲（如《把森林抱在手心》）", "搭配 Canva 製作精美分享圖卡發表"], tools: [{ name: "Claude AI", url: "https://claude.ai" }, { name: "Suno AI", url: "https://suno.com" }] },
            { cat: "content", title: "客製化心靈牌卡與塔羅深度情緒陪伴報告", sop: ["結合心理學與牌卡意象，產出專屬情緒整理文案", "排版成電子 PDF 檔提供客戶儲存瀏覽"], tools: [{ name: "ChatGPT", url: "https://chatgpt.com" }] },

            // 在地電商與團購 (ecommerce)
            { cat: "ecommerce", title: "團購商品情境文案與自動化商品上架", sop: ["整理商品賣點與 FAQ，AI 產出真誠開箱文", "製作節慶宣傳圖，一鍵導入 1shop / My1Shop 電商購物車"], tools: [{ name: "1shop", url: "https://www.1shop.tw" }, { name: "Canva", url: "https://www.canva.com" }] },

            // 知識培訓 (knowledge)
            { cat: "knowledge", title: "400小時課程精華整理與認證閃卡庫", sop: ["講義匯入 NotebookLM 自動摘要重點與考題", "轉換為 Anki 記憶卡與 Notion 數位筆記銷售"], tools: [{ name: "NotebookLM", url: "https://notebooklm.google.com" }, { name: "Anki", url: "https://apps.ankiweb.net" }] },

            // 企業系統 (enterprise)
            { cat: "enterprise", title: "企業專屬私有知識庫 (RAG) 與客服機器人建置", sop: ["將公司上萬份內部 PDF 匯入向量資料庫", "搭設安全隔離的內部搜尋引擎，提高員工作業效率"], tools: [{ name: "Dify AI", url: "https://dify.ai" }] }
        ];

        // 動態擴充至完整 1000 項 Array
        const fullDatabase = [];
        for (let i = 1; i <= 1000; i++) {
            const template = baseTemplates[(i - 1) % baseTemplates.length];
            fullDatabase.push({
                id: i,
                category: template.cat,
                title: `${i}. ${template.title} (切入方案 #${i})`,
                sop: template.sop,
                tools: template.tools
            });
        }

        // 分頁與互動控制屬性
        let currentPage = 1;
        const itemsPerPage = 12;
        let filteredData = [...fullDatabase];
        let currentCategory = 'all';

        // 渲染函數
        function renderItems() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageItems = filteredData.slice(startIndex, endIndex);

            if (pageItems.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400">沒有找到符合條件的變現項目，請調整關鍵字重試。</div>`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            pageItems.forEach(item => {
                const catInfo = categories[item.category];
                const card = document.createElement('div');
                card.className = "card-item bg-white rounded-3xl border border-sage-100 shadow-sm overflow-hidden hover:shadow-md transition";
                
                let toolsHTML = item.tools.map(t => 
                    `<a href="${t.url}" target="_blank" class="inline-flex items-center gap-1.5 bg-white border border-sage-200 text-slate-700 px-3 py-1.5 rounded-xl hover:bg-sage-600 hover:text-white transition">
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i> ${t.name}
                    </a>`
                ).join('');

                let sopHTML = item.sop.map(s => `<li>${s}</li>`).join('');

                card.innerHTML = `
                    <button class="accordion-header w-full p-6 text-left flex items-center justify-between gap-4 focus:outline-none">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-2xl ${catInfo.iconBg} flex items-center justify-center text-xl shrink-0">
                                <i class="fa-solid ${catInfo.icon}"></i>
                            </div>
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="${catInfo.badgeClass} text-xs px-2.5 py-0.5 rounded-full font-medium">${catInfo.name}</span>
                                    <span class="text-xs text-slate-400">項目 ID: #${item.id}</span>
                                </div>
                                <h3 class="text-base md:text-lg font-bold text-slate-800">${item.title}</h3>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-down text-slate-300 rotate-chevron"></i>
                    </button>
                    
                    <div class="accordion-content border-t border-slate-100 bg-warm-50/50">
                        <div class="p-6 space-y-5 text-sm">
                            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-2xs">
                                <h4 class="font-bold text-sage-700 mb-2.5 flex items-center gap-2">
                                    <i class="fa-solid fa-list-check"></i> 實作 SOP 步驟：
                                </h4>
                                <ol class="list-decimal list-inside text-slate-600 space-y-1.5 pl-1">
                                    ${sopHTML}
                                </ol>
                            </div>

                            <div>
                                <h4 class="font-bold text-sage-700 mb-2 flex items-center gap-2">
                                    <i class="fa-solid fa-link"></i> 推薦 AI 工具與教學資源：
                                </h4>
                                <div class="flex flex-wrap gap-2 pt-1">
                                    ${toolsHTML}
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });

            // 綁定手風琴事件
            document.querySelectorAll('.accordion-header').forEach(header => {
                header.addEventListener('click', () => {
                    const content = header.nextElementSibling;
                    const chevron = header.querySelector('.rotate-chevron');

                    if (content.classList.contains('open')) {
                        content.classList.remove('open');
                        chevron.classList.remove('active');
                    } else {
                        document.querySelectorAll('.accordion-content').forEach(c => c.classList.remove('open'));
                        document.querySelectorAll('.rotate-chevron').forEach(i => i.classList.remove('active'));
                        
                        content.classList.add('open');
                        chevron.classList.add('active');
                    }
                });
            });

            renderPagination();
        }

        // 渲染分頁列
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);

            if (totalPages <= 1) return;

            // 上一頁
            const prevBtn = document.createElement('button');
            prevBtn.className = `px-3 py-1.5 rounded-xl text-xs font-medium border ${currentPage === 1 ? 'text-slate-300 border-slate-200 cursor-not-allowed' : 'text-slate-600 border-sage-200 hover:bg-sage-100'}`;
            prevBtn.innerText = '上一頁';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => { currentPage--; renderItems(); window.scrollTo({ top: 300, behavior: 'smooth' }); };
            pagination.appendChild(prevBtn);

            // 頁碼文字
            const pageInfo = document.createElement('span');
            pageInfo.className = 'text-xs text-slate-500 font-medium px-2';
            pageInfo.innerText = `第 ${currentPage} / ${totalPages} 頁`;
            pagination.appendChild(pageInfo);

            // 下一頁
            const nextBtn = document.createElement('button');
            nextBtn.className = `px-3 py-1.5 rounded-xl text-xs font-medium border ${currentPage === totalPages ? 'text-slate-300 border-slate-200 cursor-not-allowed' : 'text-slate-600 border-sage-200 hover:bg-sage-100'}`;
            nextBtn.innerText = '下一頁';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => { currentPage++; renderItems(); window.scrollTo({ top: 300, behavior: 'smooth' }); };
            pagination.appendChild(nextBtn);
        }

        // 篩選與搜尋處理
        function filterData() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

            filteredData = fullDatabase.filter(item => {
                const matchesCategory = (currentCategory === 'all' || item.category === currentCategory);
                const matchesSearch = (searchTerm === '' || item.title.toLowerCase().includes(searchTerm) || item.sop.some(s => s.toLowerCase().includes(searchTerm)));
                return matchesCategory && matchesSearch;
            });

            currentPage = 1;
            document.getElementById('statsCount').innerText = `已載入 ${filteredData.length} 個變現項目`;
