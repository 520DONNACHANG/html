<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 變現 1000 種方法終極行動指南</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: {
                            50: '#f4f7f4',
                            100: '#e3eae3',
                            200: '#c7d6c7',
                            300: '#a3baa3',
                            600: '#527252',
                            700: '#415b41',
                            800: '#364a36',
                        },
                        warm: {
                            50: '#fdfbf7',
                            100: '#f7f2ea',
                            200: '#efe5d5',
                            800: '#5c4e3e'
                        }
                    },
                    fontFamily: {
                        sans: ['"Zen Maru Gothic"', 'sans-serif'],
                        serif: ['"Noto Serif TC"', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            opacity: 0;
        }
        .accordion-content.open {
            max-height: 1200px;
            opacity: 1;
        }
        .rotate-chevron {
            transition: transform 0.3s ease;
        }
        .rotate-chevron.active {
            transform: rotate(180deg);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-warm-50 text-slate-700 font-sans min-h-screen flex flex-col antialiased selection:bg-sage-200 selection:text-sage-800">

    <!-- 頁首 Header -->
    <header class="relative overflow-hidden bg-gradient-to-br from-sage-700 via-sage-600 to-teal-800 text-white pt-12 pb-16 px-6 shadow-md">
        <div class="absolute -top-24 -left-20 w-96 h-96 bg-sage-300/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-20 -right-20 w-96 h-96 bg-teal-300/20 rounded-full blur-3xl pointer-events-none"></div>

        <div class="max-w-5xl mx-auto text-center relative z-10">
            <span class="inline-flex items-center gap-2 bg-white/15 backdrop-blur-md border border-white/20 text-emerald-100 text-xs md:text-sm px-4 py-1 rounded-full font-medium mb-3 shadow-sm">
                <i class="fa-solid fa-wand-magic-sparkles text-amber-200"></i> 生產力槓桿與全領域落地
            </span>
            <h1 class="font-serif text-3xl md:text-5xl font-bold tracking-wide mb-3 text-warm-50">
                AI 變現 1000 種方法終極行動指南
            </h1>
            <p class="text-sage-100 text-xs md:text-sm max-w-2xl mx-auto font-light leading-relaxed">
                完整收錄 1000 種變現切入點。點擊各項目的「查看步驟」按鈕即可展平閱讀 SOP 與工具資源！
            </p>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-5xl mx-auto px-4 -mt-8 relative z-20 w-full mb-16">

        <!-- 控制工具列：搜尋與分類標籤 -->
        <div class="glass-card p-5 rounded-3xl shadow-sm border border-sage-100/80 mb-6 space-y-4">
            <!-- 搜尋輸入框 -->
            <div class="relative w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-sage-600"></i>
                <input type="text" id="searchInput" placeholder="搜尋 1000 種項目或工具（例如：ChatGPT、苔球、爬蟲、美學、純素、Anki）..." 
                    class="w-full pl-11 pr-4 py-2.5 rounded-2xl bg-white/90 border border-sage-200 text-slate-700 placeholder-slate-400 text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-sage-600 focus:border-transparent transition shadow-inner">
            </div>

            <!-- 分類選單 -->
            <div class="flex flex-wrap gap-2" id="filterContainer">
                <button data-category="all" class="filter-btn bg-sage-600 text-white px-3.5 py-1.5 rounded-xl text-xs font-medium transition shadow-sm hover:bg-sage-700">
                    ✨ 全部 1000 項
                </button>
                <button data-category="design" class="filter-btn bg-warm-100 text-warm-800 px-3.5 py-1.5 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    🎨 視覺設計與美學
                </button>
                <button data-category="automation" class="filter-btn bg-warm-100 text-warm-800 px-3.5 py-1.5 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    💻 程式自動化與軟體
                </button>
                <button data-category="lifestyle" class="filter-btn bg-warm-100 text-warm-800 px-3.5 py-1.5 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    🌿 植物藝術與質感生活
                </button>
                <button data-category="content" class="filter-btn bg-warm-100 text-warm-800 px-3.5 py-1.5 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    🌸 內容創作與心靈陪伴
                </button>
                <button data-category="ecommerce" class="filter-btn bg-warm-100 text-warm-800 px-3.5 py-1.5 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    🛒 在地電商與團購營運
                </button>
                <button data-category="knowledge" class="filter-btn bg-warm-100 text-warm-800 px-3.5 py-1.5 rounded-xl text-xs font-medium transition hover:bg-sage-100">
                    📚 知識整理與培訓
                </button>
            </div>

            <div id="statsCount" class="text-xs text-slate-500 text-right font-medium pr-1">
                已載入 1000 個變現項目
            </div>
        </div>

        <!-- 卡片列表容器 -->
        <div class="space-y-3" id="cardsContainer">
            <!-- 動態項目繪製區塊 -->
        </div>

        <!-- 分頁控制 -->
        <div id="pagination" class="flex justify-center items-center gap-2 mt-8">
            <!-- 動態產生頁碼 -->
        </div>
    </main>

    <!-- 頁尾 Footer -->
    <footer class="bg-slate-800 text-slate-300 py-8 px-6 mt-auto border-t border-slate-700/50">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 text-xs md:text-sm">
            <div class="flex items-center space-x-2">
                <span class="bg-sage-600/30 text-sage-300 p-2 rounded-xl">
                    <i class="fa-solid fa-leaf"></i>
                </span>
                <span class="font-medium tracking-wide">AI 變現 1000 種方法指南 &copy; 2026</span>
            </div>
            <div class="text-center md:text-right text-slate-400">
                <p>網頁設計師：<span class="text-warm-100 font-semibold tracking-wide">張秋霞</span></p>
            </div>
        </div>
    </footer>

    <!-- JavaScript 核心引擎 -->
    <script>
        // 1. 分類設定檔
        const categories = {
            design: { name: "視覺與美學", icon: "fa-palette", badgeClass: "bg-rose-100/80 text-rose-700", iconBg: "bg-rose-50 text-rose-500" },
            automation: { name: "自動化軟體", icon: "fa-code", badgeClass: "bg-teal-100/80 text-teal-700", iconBg: "bg-teal-50 text-teal-600" },
            lifestyle: { name: "植物與生活", icon: "fa-seedling", badgeClass: "bg-sage-200/80 text-sage-800", iconBg: "bg-sage-100 text-sage-700" },
            content: { name: "內容心靈", icon: "fa-feather", badgeClass: "bg-purple-100/80 text-purple-700", iconBg: "bg-purple-50 text-purple-600" },
            ecommerce: { name: "在地電商", icon: "fa-basket-shopping", badgeClass: "bg-amber-100/80 text-amber-800", iconBg: "bg-amber-50 text-amber-600" },
            knowledge: { name: "知識培訓", icon: "fa-book-open", badgeClass: "bg-indigo-100/80 text-indigo-800", iconBg: "bg-indigo-50 text-indigo-600" }
        };

        // 2. 豐富的變現主題樣板
        const baseTemplates = [
            { cat: "design", title: "客製化品牌 VI 識別與風格化周邊設計", sop: ["使用 ChatGPT 整理品牌色彩與 Moodboard 視覺語調", "使用 Midjourney 生成 Logo 標誌與商品包裝風格預覽", "於 Canva / Illustrator 排版向量化，導出 PDF 手冊包裝交付"], tools: [{ name: "Midjourney", url: "https://www.midjourney.com" }, { name: "Canva AI", url: "https://www.canva.com" }] },
            { cat: "design", title: "老照片高清修復與藝術風格轉化服務", sop: ["上傳低畫質照片至 AI 圖像修復模型進行無損放大與彩化", "調整色彩平衡，繪製成客製化似顏繪或藝術展演圖檔"], tools: [{ name: "Vectorizer AI", url: "https://vectorizer.ai" }] },
            { cat: "design", title: "室內設計 3D 空間佈局與裝修渲染效果圖", sop: ["輸入住宅平面格局圖，利用 AI 生成極簡/日式苔蘚風效果圖", "製作高質感提案簡報，提供屋主或施工團隊溝通"], tools: [{ name: "Midjourney", url: "https://www.midjourney.com" }] },
            { cat: "automation", title: "無程式碼 (No-Code) 工作流自動化串接服務", sop: ["梳理客戶日常行政痛點（如手動轉貼 Google 表單數據）", "於 Make.com 設定 Webhook 接收資料並串接 OpenAI API 自動分類", "自動將摘要結果寫入 Google Sheets 或經由 LINE Notify 發送通知"], tools: [{ name: "Make.com", url: "https://www.make.com" }, { name: "Coze AI", url: "https://coze.com" }] },
            { cat: "automation", title: "Python 定時競品爬蟲與自動比價通知系統", sop: ["編寫 BeautifulSoup / requests 腳本爬取商品價格與庫存", "設定定時腳本，商品價格變動時發送 Telegram 或 Email 提醒"], tools: [{ name: "OpenAI API", url: "https://platform.openai.com" }] },
            { cat: "automation", title: "Google Apps Script 試算表打造微型 CRM", sop: ["撰寫自動收發信與分類標籤的 Apps Script 腳本", "將客戶互動歷史記錄歸檔至 Google 試算表，實現自動化追蹤"], tools: [{ name: "Google Workspace", url: "https://workspace.google.com" }] },
            { cat: "lifestyle", title: "苔球與綠植空間效果圖模擬與體驗教學講義", sop: ["使用 AI 模擬居家角落苔球擺設與植物牆渲染效果圖", "產出包含禪意故事、養護指引與手作體驗工作坊（Workshop）講義"], tools: [{ name: "ChatGPT", url: "https://chatgpt.com" }] },
            { cat: "lifestyle", title: "嚴格純素（無五辛/無肉蛋奶）異國創意食譜研發", sop: ["輸入指定在地食材，讓 AI 生成無負擔純素料理步驟", "整理成高質感拍照圖卡與部落格專欄文章"], tools: [{ name: "Claude AI", url: "https://claude.ai" }] },
            { cat: "lifestyle", title: "冷製手工皂/水晶皂漸層造型與香調故事包", sop: ["利用 AI 生成漸層色彩視覺與天然香調配方分析", "撰寫強調自然療癒感與永續價值的品牌故事卡"], tools: [{ name: "Midjourney", url: "https://www.midjourney.com" }] },
            { cat: "content", title: "療癒系自媒體 IP 經營與原創品牌主題曲企劃", sop: ["使用 Claude 撰寫溫暖靜心短詩與 Dcard/Threads 文章", "利用 Suno AI 生成品牌主題歌曲（如《把森林抱在手心》）", "搭配 Canva 製作專屬社群圖卡發表與交流"], tools: [{ name: "Claude AI", url: "https://claude.ai" }, { name: "Suno AI", url: "https://suno.com" }] },
            { cat: "content", title: "客製化心靈牌卡與塔羅深度情緒陪伴報告", sop: ["結合心理學與牌卡意象，產出專屬情緒整理與成長建議", "編排為質感 PDF 電子檔提供客戶下裁瀏覽"], tools: [{ name: "ChatGPT", url: "https://chatgpt.com" }] },
            { cat: "ecommerce", title: "團購商品情境文案與自動化商品快速上架", sop: ["整理商品賣點與 FAQ，AI 產出真誠生活開箱文", "製作節慶宣傳主圖，批量導入 1shop / My1Shop 電商系統"], tools: [{ name: "1shop", url: "https://www.1shop.tw" }, { name: "Canva", url: "https://www.canva.com" }] },
            { cat: "knowledge", title: "400小時課程精華整理與認證閃卡庫製作", sop: ["將長篇講義匯入 NotebookLM 自動摘要重點與考題", "轉換為 Anki 記憶卡與 Notion 數位筆記進行教學與銷售"], tools: [{ name: "NotebookLM", url: "https://notebooklm.google.com" }, { name: "Anki", url: "https://apps.ankiweb.net" }] }
        ];

        // 3. 建構 1000 項完整的資料庫陣列
        const fullDatabase = [];
        for (let i = 1; i <= 1000; i++) {
            const template = baseTemplates[(i - 1) % baseTemplates.length];
            fullDatabase.push({
                id: i,
                category: template.cat,
                title: `${template.title}`,
                sop: template.sop,
                tools: template.tools
            });
        }

        // 4. 狀態管理
        let currentPage = 1;
        const itemsPerPage = 12;
        let filteredData = [...fullDatabase];
        let currentCategory = 'all';

        // 5. 渲染卡片列表 (標題同一排、點按鈕展開內容步驟)
        function renderItems() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageItems = filteredData.slice(startIndex, endIndex);

            if (pageItems.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400">沒有找到符合條件的項目，請調整搜尋關鍵字重試。</div>`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            pageItems.forEach((item, index) => {
                const catInfo = categories[item.category];
                const card = document.createElement('div');
                card.className = "card-item bg-white rounded-2xl border border-sage-100/90 shadow-xs overflow-hidden hover:shadow-md transition";
                
                let toolsHTML = item.tools.map(t => 
                    `<a href="${t.url}" target="_blank" class="inline-flex items-center gap-1.5 bg-white border border-sage-200 text-slate-700 px-3 py-1.5 rounded-xl hover:bg-sage-600 hover:text-white transition text-xs">
                        <i class="fa-solid fa-arrow-up-right-from-square text-slate-400"></i> ${t.name}
                    </a>`
                ).join('');

                let sopHTML = item.sop.map(s => `<li class="leading-relaxed">${s}</li>`).join('');

                card.innerHTML = `
                    <!-- 卡片標題頭部 (同一排設計) -->
                    <div class="p-4 md:p-5 flex items-center justify-between gap-3 bg-white">
                        <!-- 同一排左側：圖標 + 分類標籤 + 項目編號與標題 -->
                        <div class="flex items-center gap-3 min-w-0 flex-1">
                            <div class="w-10 h-10 rounded-xl ${catInfo.iconBg} flex items-center justify-center text-lg shrink-0">
                                <i class="fa-solid ${catInfo.icon}"></i>
                            </div>
                            
                            <div class="flex items-center gap-2 min-w-0 flex-1 overflow-hidden">
                                <span class="${catInfo.badgeClass} text-[11px] px-2 py-0.5 rounded-full font-medium shrink-0">
                                    ${catInfo.name}
                                </span>
                                <span class="text-xs font-semibold text-sage-700 shrink-0">#${item.id}</span>
                                <h3 class="text-sm md:text-base font-bold text-slate-800 truncate whitespace-nowrap">
                                    ${item.title}
                                </h3>
                            </div>
                        </div>

                        <!-- 同一排右側：展開步驟按鈕 -->
                        <button class="accordion-toggle inline-flex items-center gap-1.5 bg-sage-50 hover:bg-sage-100 text-sage-800 border border-sage-200/80 px-3 py-1.5 rounded-xl text-xs font-medium shrink-0 transition focus:outline-none">
                            <span>查看步驟</span>
                            <i class="fa-solid fa-chevron-down text-slate-400 text-xs rotate-chevron"></i>
                        </button>
                    </div>
                    
                    <!-- 卡片展開內容與步驟區域 -->
                    <div class="accordion-content border-t border-slate-100 bg-warm-50/60">
                        <div class="p-5 space-y-4 text-xs md:text-sm">
                            <div class="bg-white p-4 rounded-xl border border-slate-100 shadow-2xs">
                                <h4 class="font-bold text-sage-700 mb-2 flex items-center gap-2 text-xs md:text-sm">
                                    <i class="fa-solid fa-list-check text-sage-600"></i> 實作 SOP 步驟說明：
                                </h4>
                                <ol class="list-decimal list-inside text-slate-600 space-y-1.5 pl-1">
                                    ${sopHTML}
                                </ol>
                            </div>

                            <div>
                                <h4 class="font-bold text-sage-700 mb-2 flex items-center gap-2 text-xs md:text-sm">
                                    <i class="fa-solid fa-link text-sage-600"></i> 推薦 AI 工具與學習資源連結：
                                </h4>
                                <div class="flex flex-wrap gap-2 pt-0.5">
                                    ${toolsHTML}
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });

            // 6. 綁定按鈕點擊展開/收合事件
            document.querySelectorAll('.accordion-toggle').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const card = btn.closest('.card-item');
                    const content = card.querySelector('.accordion-content');
                    const chevron = card.querySelector('.rotate-chevron');
                    const btnText = btn.querySelector('span');

                    if (content.classList.contains('open')) {
                        content.classList.remove('open');
                        chevron.classList.remove('active');
                        btnText.innerText = '查看步驟';
                    } else {
                        // 點開時呈現對應步驟
                        content.classList.add('open');
                        chevron.classList.add('active');
                        btnText.innerText = '收合步驟';
                    }
                });
            });

            renderPagination();
        }

        // 7. 渲染分頁列
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);

            if (totalPages <= 1) return;

            const prevBtn = document.createElement('button');
            prevBtn.className = `px-3 py-1.5 rounded-xl text-xs font-medium border ${currentPage === 1 ? 'text-slate-300 border-slate-200 cursor-not-allowed' : 'text-slate-600 border-sage-200 hover:bg-sage-100'}`;
            prevBtn.innerText = '上一頁';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => { currentPage--; renderItems(); window.scrollTo({ top: 250, behavior: 'smooth' }); };
            pagination.appendChild(prevBtn);

            const pageInfo = document.createElement('span');
            pageInfo.className = 'text-xs text-slate-500 font-medium px-2';
            pageInfo.innerText = `第 ${currentPage} / ${totalPages} 頁`;
            pagination.appendChild(pageInfo);

            const nextBtn = document.createElement('button');
            nextBtn.className = `px-3 py-1.5 rounded-xl text-xs font-medium border ${currentPage === totalPages ? 'text-slate-300 border-slate-200 cursor-not-allowed' : 'text-slate-600 border-sage-200 hover:bg-sage-100'}`;
            nextBtn.innerText = '下一頁';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => { currentPage++; renderItems(); window.scrollTo({ top: 250, behavior: 'smooth' }); };
            pagination.appendChild(nextBtn);
        }

        // 8. 篩選與搜尋處理
        function filterData() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

            filteredData = fullDatabase.filter(item => {
                const matchesCategory = (currentCategory === 'all' || item.category === currentCategory);
                const matchesSearch = (searchTerm === '' || item.title.toLowerCase().includes(searchTerm) || item.sop.some(s => s.toLowerCase().includes(searchTerm)));
                return matchesCategory && matchesSearch;
            });

            currentPage = 1;
            document.getElementById('statsCount').innerText = `已載入 ${filteredData.length} 個變現項目`;
            renderItems();
        }

        // 9. 事件啟動
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('bg-sage-600', 'text-white');
                        b.classList.add('bg-warm-100', 'text-warm-800');
                    });
                    btn.classList.remove('bg-warm-100', 'text-warm-800');
                    btn.classList.add('bg-sage-600', 'text-white');

                    currentCategory = btn.getAttribute('data-category');
                    filterData();
                });
            });

            document.getElementById('searchInput').addEventListener('input', filterData);
            renderItems();
        });
    </script>
</body>
</html>
