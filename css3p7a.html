<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>限時搶購</title>
    <style>
        /* CSS 樣式必須寫在 <style> 標籤內部 */
        .promo-banner {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF2A2A 100%);
            color: white;
            padding: 30px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(255, 42, 42, 0.3);
        }
    </style>
</head>
<body>

    <!-- HTML 內容寫在 <body> 標籤內部 -->
    <div class="promo-banner">限時搶購 START!</div>

</body>
</html>
